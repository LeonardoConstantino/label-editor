<!doctype html>
<html lang="pt-BR" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>Label Editor | Tactile Prism</title>
    <style>
      /* ============================================================
        SPLASH — CSS auto-contido (zero dependência de Tailwind)
        Espelha fielmente os tokens do Tactile Prism
        ============================================================ */

      /* Tokens locais — espelham o main.css sem depender dele */
      html[data-theme=dark] #app-splash {
        --canvas:           #0f1115;
        --surface-elevated: #1e222b;
        --border-ui:        #262a33;
        --text-main:        #f8fafc;
        --text-muted:       #94a3b8;
        --accent:           #6366f1;
        --accent-hover:     #4f46e5;
        --ease-spring:      cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-out:         cubic-bezier(0.16, 1, 0.3, 1);
      }

      html[data-theme=light] #app-splash {
        --canvas: #f8fafc;
        --surface-elevated: #e2e8f0;
        --border-ui: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --ease-spring:      cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-out:         cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* ── Reset local ── */
      #app-splash *,
      #app-splash *::before,
      #app-splash *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── Camada raiz ── */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--canvas);
        /* Saída: adicionar .splash--out para disparar */
        transition:
          opacity 400ms var(--ease-out),
          transform 400ms var(--ease-out);
      }

      /* Estado de saída */
      .splash--out {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }

      /* ── Noise grain (pseudo-textura física) ── */
      .splash__noise {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 256px 256px;
      }

      /* ── Vignette radial ── */
      .splash__vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
      }

      /* ── Corpo central ── */
      .splash__body {
        position: relative;
        display: flex;
        gap: 4px;
        flex-direction: column;
        align-items: center;
        animation: splash-enter 0.7s var(--ease-out) both;
      }

      @keyframes splash-enter {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0);    }
      }

      /* ── Glow difuso atrás do ícone ── */
      .splash__glow {
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-50%);
        width: 240px;
        height: 120px;
        background: rgba(99, 102, 241, 0.12);
        border-radius: 50%;
        filter: blur(56px);
        pointer-events: none;
        animation: glow-pulse 3s ease-in-out infinite;
      }

      @keyframes glow-pulse {
        0%, 100% { opacity: 1;   transform: translateX(-50%) scale(1);    }
        50%       { opacity: 0.6; transform: translateX(-50%) scale(0.92); }
      }

      /* ── Wrapper do ícone ── */
      .splash__icon-wrap {
        position: relative;
        width: 80px;
        height: 80px;
        background: var(--surface-elevated);
        border: 1px solid var(--border-ui);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        overflow: hidden;
        box-shadow:
          inset 0 2px 10px rgba(0, 0, 0, 0.8),
          0 0 15px rgba(99, 102, 241, 0.2);
        animation: icon-pop 0.6s 0.1s var(--ease-spring) both;
      }

      @keyframes icon-pop {
        from { opacity: 0; transform: scale(0.82); }
        to   { opacity: 1; transform: scale(1);    }
      }

      /* ── Shimmer wipe no ícone ── */
      .splash__shimmer {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          transparent 0%,
          rgba(255,255,255,0.09) 50%,
          transparent 100%
        );
        transform: translateX(-100%);
        animation: shimmer-wipe 2.4s 0.8s ease-in-out infinite;
      }

      @keyframes shimmer-wipe {
        0%        { transform: translateX(-100%); }
        40%, 100% { transform: translateX(100%);  }
      }

      /* ── SVG do ícone ── */
      .splash__icon-svg {
        color: var(--accent);
        filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.8));
        position: relative;
        z-index: 1;
      }

      /* ── Wordmark ── */
      .splash__title {
        font-family: -apple-system, 'Inter', system-ui, sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        margin-bottom: 6px;

        /* Gradiente vertical branco — fiel ao original */
        background: linear-gradient(to bottom, #ffffff 0%, rgba(255,255,255,0.55) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;

        animation: splash-enter 0.6s 0.15s var(--ease-out) both;
      }

      /* ── Badge de versão ── */
      .splash__version {
        font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
        font-size: 18px;
        font-weight: 400;
        margin-left: 6px;
        letter-spacing: 0;
        -webkit-text-fill-color: var(--accent);
        color: var(--accent);
      }

      /* ── Tagline ── */
      .splash__tagline {
        font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
        font-size: 10px;
        font-weight: 500;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.4em;
        margin-bottom: 36px;
        filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.4));
        animation: splash-enter 0.6s 0.25s var(--ease-out) both;
      }

      /* ── Progress track ── */
      .splash__progress-track {
        width: 180px;
        height: 2px;
        background: var(--border-ui);
        border-radius: 999px;
        overflow: hidden;
        animation: splash-enter 0.6s 0.35s var(--ease-out) both;
      }

      /* ── Progress bar indeterminada ── */
      .splash__progress-bar {
        height: 100%;
        width: 40%;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          rgba(99, 102, 241, 0.4)
        );
        border-radius: 999px;
        animation: progress-sweep 1.6s var(--ease-out) infinite;
      }

      @keyframes progress-sweep {
        0%   { transform: translateX(-100%); opacity: 0;   }
        20%  { opacity: 1; }
        100% { transform: translateX(300%);  opacity: 0.2; }
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        .splash,
        .splash__body,
        .splash__icon-wrap,
        .splash__title,
        .splash__tagline,
        .splash__progress-track {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .splash__shimmer     { animation: none; }
        .splash__glow        { animation: none; }
        .splash__progress-bar {
          animation: none;
          width: 60%;
          opacity: 0.6;
        }
        .splash--out {
          opacity: 0;
          transform: none;
          transition: opacity 200ms ease;
        }
      }
      </style>
    <script>
      // Previne FOUC (Flash of Unstyled Content) aplicando tema window.matchMedia antes do carregamento do CSS
      (function() {
        try {
          const theme = 
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          console.error('Error applying theme:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app-splash" class="splash">

      <!-- Noise texture overlay -->
      <div class="splash__noise"></div>

      <!-- Radial vignette -->
      <div class="splash__vignette"></div>

      <!-- Conteúdo central -->
      <div class="splash__body">

        <!-- Glow de fundo atrás do ícone -->
        <div class="splash__glow"></div>

        <!-- Ícone / Logo -->
        <div class="splash__icon-wrap">
          <!-- Wipe shimmer -->
          <div class="splash__shimmer"></div>
          <!-- SVG inline do Lucide "layers" — sem dependência de ui-icon -->
          <svg
            class="splash__icon-svg"
            xmlns="http://www.w3.org/2000/svg"
            width="40" height="40"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 2 2 7l10 5 10-5-10-5Z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>

        <!-- Wordmark -->
        <h1 class="splash__title">
          Label Forge OS
          <span class="splash__version">v4.0</span>
        </h1>

        <!-- Tagline -->
        <p class="splash__tagline">Tactile Design Engine</p>

        <!-- Barra de progresso indeterminada -->
        <div class="splash__progress-track" role="progressbar" aria-label="Carregando…">
          <div class="splash__progress-bar"></div>
        </div>

      </div>

    </div>

    <div class="layout-container">
      <!-- O Canvas ocupa o fundo total -->
      <editor-canvas class="canvas-workspace"></editor-canvas>

      <!-- UI Flutuante -->
      <editor-toolbar class="toolbar-pill"></editor-toolbar>

      <aside class="panel-glass isolate">
        <app-cockpit></app-cockpit>
        <ui-tooltip
          tooltip-ref="telemetric-balloon"
          placement="left"
          variant="primary"
          delay="100"
        >
          <div
            slot="target"
            class="flex items-center justify-between gap-3 pl-3 pr-5 h-6 font-mono text-2xs uppercase tracking-[0.05em] text-text-muted tabular-nums w-full mt-auto shrink-0 select-none"
          >
            <div class="flex items-center gap-3">
              <span
                id="sys-led"
                class="inline-block w-1.5 h-1.5 rounded-full bg-accent-success shadow-[0_0_8px_var(--color-accent-success)] animate-pulse-led cursor-crosshair transition-[background-color,box-shadow] duration-300"
                title="Developer Mode: Click 5 times"
              ></span>
              <span id="sys-status-text">SYS OK</span>
              <div id="production-status-container" class="hidden items-center gap-2 ml-2 border-l border-white/10 pl-2 animate-in fade-in duration-300">
                <span class="text-accent-primary font-bold" id="production-percent">0%</span>
              </div>
              <!-- <div id="dirty-indicator" class="hidden items-center gap-1.5 ml-3 border-l border-white/10 pl-3 group" title="Unsaved changes in Vault">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.5)]"></span>
                <span class="text-[9px] text-amber-500/80 font-mono font-bold tracking-tighter uppercase">Unsaved</span>
              </div> -->
            </div>

            <div class="flex items-center gap-3">
              <span
                >MS:<span
                  id="render-time"
                  class="text-accent-primary font-bold ml-0.5 tabular-nums"
                  >0.00MS</span
                ></span
              >
              <span class="w-px h-2.5 bg-border-ui mx-1 opacity-50"></span>
              <span
                >EL:<span
                  id="el-count"
                  class="text-text-main font-bold ml-0.5 tabular-nums"
                  >00</span
                ></span
              >
              <span class="w-px h-2.5 bg-border-ui mx-1 opacity-50"></span>
              <span
                >Z:<span
                  id="zoom-lvl"
                  class="text-text-main font-bold ml-0.5 tabular-nums"
                  >100</span
                >%</span
              >
              <span 
                class="w-px h-2.5 bg-border-ui mx-1 opacity-50" 
                id="cloud-sync-separator" 
                hidden
              ></span>

              <ui-icon
                id="cloud-sync-indicator"
                name="cloud"
                size="sm"
                class="transition-colors duration-300 cursor-default"
                title="Cloud Sync: Não configurado"
                hidden
              ></ui-icon>
            </div>
          </div>
        </ui-tooltip>
      </aside>

      <!-- Position Fixed, Bottom-6 centralizado horizontalmente -->
      <div
        class="fixed bottom-8 left-1/2 -translate-x-1/2 z-40 pointer-events-auto"
      >
        <ui-hud-tips id="global-tips"></ui-hud-tips>
      </div>
    </div>

    <!-- Modais de Takeover -->
    <ui-modal
      id="batch-modal"
      heading="Production Cockpit: Batch & Imposition"
      size="fullscreen"
    >
      <data-source-input></data-source-input>
    </ui-modal>

    <ui-modal
      id="vault-modal"
      heading="Storage Vault: Asset Library"
      size="fullscreen"
    >
      <vault-gallery></vault-gallery>
    </ui-modal>

    <ui-modal id="welcome-modal" heading="Welcome" size="xl">
      <ui-welcome-screen></ui-welcome-screen>
    </ui-modal>

    <ui-modal id="settings-modal" heading="System Preferences: Calibration Matrix" size="xl">
      <preferences-modal></preferences-modal>
    </ui-modal>

    <ui-modal id="help-center-modal" heading="Help Center" size="xl">
      <ui-help-center></ui-help-center>
    </ui-modal>

    <ui-modal id="project-modal" heading="Project Management" size="lg">
      <div class="flex flex-col gap-6 p-2">
        <div class="card-module">
          <h3 class="label-prism">Transfer design</h3>
          <p class="text-text-muted text-xs mb-4">
            Mova seus designs entre diferentes dispositivos ou faça um backup de
            segurança.
          </p>
          <div class="flex gap-4">
            <app-button
              id="btn-export-file"
              variant="secondary"
              style="flex: 1"
            >
              <ui-icon name="download"></ui-icon> EXPORT .LABEL
            </app-button>
            <app-button
              id="btn-import-trigger"
              variant="primary"
              style="flex: 1"
            >
              <ui-icon name="upload"></ui-icon> IMPORT .LABEL
            </app-button>
          </div>
        </div>
      </div>
    </ui-modal>

    <ui-modal id="image-editor-modal" heading="Micro Image Editor" size="fullscreen">
      <micro-image-editor id="image-editor"></micro-image-editor>
    </ui-modal>

    <template id="telemetric-balloon">
      <div>
        <div class="flex justify-between mb-2 pb-1 border-b border-white/10">
          <span class="flex items-center gap-1.5 text-accent-primary">
            <ui-icon name="command-line" size="xs"></ui-icon>
            Telemetry Dashboard
          </span>
          <span class="text-accent-success animate-pulse font-mono text-2xs"
            >ACTIVE</span
          >
        </div>

        <div
          class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1.5 text-[10px] text-text-muted mt-2 font-mono"
        >
          <span class="opacity-50 uppercase">Performance:</span>
          <span class="text-text-main">
            <span id="fps-lvl" class="tabular-nums">0 FPS</span>
            <span class="opacity-30 mx-1">|</span>
            Render: <span id="render-time-tip" class="tabular-nums">0ms</span>
          </span>

          <span class="opacity-50 uppercase">Resolution:</span>
          <span class="text-text-main tabular-nums" id="canvas-res">0x0 PX</span>

          <span class="opacity-50 uppercase">Breakdown:</span>
          <span class="text-text-main tabular-nums" id="breakdown">...</span>

          <span class="opacity-50 uppercase">History:</span>
          <span class="text-text-main tabular-nums" id="hist-nodes">0 / 50 Nodes</span>

          <span class="opacity-50 uppercase">Environment:</span>
          <span class="text-text-main tabular-nums" id="os-info">Detecting...</span>

          <span class="opacity-50 uppercase">Sync Status:</span>
          <span class="text-text-main tabular-nums" id="cloud-sync-status">Not Configured</span>
        </div>

        <div
          class="mt-3 pt-2 border-t border-white/5 flex gap-2 items-start text-2xs text-accent-primary/80"
        >
          <ui-icon
            name="cpu"
            style="--icon-size: 10px"
            class="shrink-0 mt-0.5"
          ></ui-icon>
          <span class="leading-relaxed"
            >Engine: Tactile Render v4.0.</br>Hardware acceleration enabled via 2D
            Canvas context.</br>Persistence via IndexedDB Storage.</br>Sincronização em segundo plano via GistDb.</span
          >
        </div>
      </div>
    </template>

    <input
      type="file"
      id="global-import-input"
      accept=".label,.json"
      style="display: none"
    />

    <ui-tooltip-manager></ui-tooltip-manager>
    <!-- <script src="https://unpkg.com/canvas-txt@4.1.1"></script> -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
